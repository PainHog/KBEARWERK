name: Build Windows app

# Builds a ready-to-run KBEARWERK.exe on every push, so there is never a build
# script to run by hand — just download the finished app from the run's Artifacts.

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Import smoke test
        run: python -c "import kbearwerk.app; print('import OK')"

      - name: Run service tests
        run: python -m pytest -q tests || echo "pytest not critical for build"

      - name: Build the .exe
        run: >
          pyinstaller --onefile --windowed --name KBEARWERK
          --collect-all customtkinter
          --collect-all tkinterdnd2
          --collect-all keyring
          main.py

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: KBEARWERK-windows
          path: dist/KBEARWERK.exe
          if-no-files-found: error
